name: CI

on:
    push:
        branches: ["main"]
    pull_request:
        branches: ["main"]
    workflow_dispatch:

concurrency:
    group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
    cancel-in-progress: true

jobs:
    build:
        name: Unit & widget tests
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4
            - run: |
                  echo "APPWRITE_PROJECT_ID=community-app" >> .env
                  echo "APPWRITE_DATABASE_ID=communitydb" >> .env
                  echo "APPWRITE_API_KEY=placeholder" >> .env
                  echo "APPWRITE_URL=http://localhost/v1" >> .env
                  mkdir -p appwrite
                  echo "APPWRITE_PROJECT_ID=community-app" >> appwrite/.env
                  echo "APPWRITE_DATABASE_ID=communitydb" >> appwrite/.env
                  echo "APPWRITE_API_KEY=placeholder" >> appwrite/.env
                  echo "APPWRITE_URL=http://localhost/v1" >> appwrite/.env
            - uses: subosito/flutter-action@v2
              with:
                  channel: stable
                  cache: true
            - run: flutter pub get
            - run: flutter pub run build_runner build --delete-conflicting-outputs
            - run: flutter test

    e2e:
        name: E2E (integration_test on macOS)
        runs-on: macos-latest
        timeout-minutes: 45
        steps:
            - uses: actions/checkout@v4
            - run: |
                  mkdir -p appwrite
                  echo "APPWRITE_PROJECT_ID=community-app" >> appwrite/.env
                  echo "APPWRITE_DATABASE_ID=communitydb" >> appwrite/.env
                  echo "APPWRITE_API_KEY=placeholder" >> appwrite/.env
                  echo "APPWRITE_URL=http://localhost/v1" >> appwrite/.env
            - uses: subosito/flutter-action@v2
              with:
                  channel: stable
                  cache: true
            - run: flutter config --enable-macos-desktop
            - run: flutter pub get
            - run: flutter pub run build_runner build --delete-conflicting-outputs
            - run: flutter test integration_test/app_test.dart -d macos
