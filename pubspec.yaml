name: community
description: "A community app"

publish_to: "none"

version: 1.0.0+1

environment:
  sdk: ">=3.4.1 <4.0.0"

dependencies:
  appwrite: ^23.0.0
  bloc: ^9.2.0
  cupertino_icons: ^1.0.9
  flutter_dotenv: ^6.0.0
  equatable: ^2.0.8
  file_picker: ^10.3.3
  flutter:
    sdk: flutter
  flutter_bloc: ^9.1.0
  flutter_localizations:
    sdk: flutter
  flutter_svg: ^2.2.4
  font_awesome_flutter: ^10.7.0
  fpdart: ^1.2.0
  get_it: ^8.0.3
  http: ^1.6.0
  intl: 0.20.2
  isar: ^3.1.0+1
  isar_flutter_libs:
    git:
      url: https://github.com/MrLittleWhite/isar_flutter_libs.git
  path_provider: ^2.1.5
  share_plus: ^12.0.2
  speech_to_text: ^7.0.0
  emoji_picker_flutter: ^4.4.0
  url_launcher: ^6.3.0

  flutter_map: ^6.1.0
  latlong2: ^0.9.0
  table_calendar: ^3.1.2

dependency_overrides:
  flutter_web_auth_2: ^4.1.0

dev_dependencies:
  # Pinned range: isar_generator needs analyzer <6; caret ^2.4.13 wrongly allows build_runner 2.13.x.
  build_runner: ">=2.4.13 <2.5.0"
  flutter_lints: ^6.0.0
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  mockito: ">=5.4.4 <5.4.5"
  mocktail: ^1.0.4
  isar_generator: ^3.1.0+1

flutter:
  uses-material-design: true
  generate: true

  assets:
    - assets/images/
    - assets/icons/
    - assets/default_avatar.png
    - appwrite/.env

  fonts:
    - family: Montserrat
      fonts:
        - asset: lib/core/fonts/Montserrat-Regular.ttf
        - asset: lib/core/fonts/Montserrat-Italic.ttf
          style: italic
        - asset: lib/core/fonts/Montserrat-Bold.ttf
          weight: 700
        - asset: lib/core/fonts/Montserrat-Thin.ttf
          weight: 100
